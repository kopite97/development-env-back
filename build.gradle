plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kopite'
version = '0.0.1-SNAPSHOT'
description = 'devspace'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// A bridge artifact must never contain the later contract migration.
def categoryStage = providers.gradleProperty('categoryStage').orElse('bridge')
if (!(categoryStage.get() in ['bridge', 'final'])) {
    throw new GradleException('categoryStage must be bridge or final')
}
tasks.named('processResources') {
    inputs.property('categoryStage', categoryStage)
    doFirst {
        // Copy tasks do not remove files left by a previous final build.
        if (categoryStage.get() == 'bridge') {
            def stale = new File(destinationDir, 'db/migration/V17__retire_classification_scope.sql')
            def buildRoot = layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
            if (!stale.toPath().toAbsolutePath().normalize().startsWith(buildRoot)) {
                throw new GradleException('Refusing to remove a migration outside the build directory')
            }
            if (stale.exists() && !stale.delete()) throw new GradleException('Cannot remove stale final migration')
        }
    }
    from('src/main/migration-stages/cutover') { into 'db/migration' }
    if (categoryStage.get() == 'final') {
        from('src/main/migration-stages/contract') { into 'db/migration' }
    }
    doLast {
        new File(destinationDir, 'category-transition.properties').text =
            "app.category-transition.legacy-replay-enabled=${categoryStage.get() == 'bridge'}\n"
    }
}
