plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kopite'
version = '0.0.1-SNAPSHOT'
description = 'devspace'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Widget releases require the post-V17 schema. Never silently opt into contract migrations.
def categoryStage = providers.gradleProperty('categoryStage')
// Compilation is not a release or database operation. Guard executable workflows instead.
// Keep validation as a dependency so up-to-date outputs cannot bypass the check.
def validateCategoryStage = tasks.register('validateCategoryStage') {
    group = 'verification'
    description = 'Require explicit final selection before packaging, testing or Gradle application startup.'
    doLast {
        if (categoryStage.orNull != 'final') {
            throw new GradleException('This release is final-only. Specify -PcategoryStage=final explicitly. ' +
                'For the bridge replay window use the preserved pre-Widget artifact/source; ' +
                'see docs/project-category-only-rollout.md. V17 drain checks still apply at startup.')
        }
    }
}
['bootJar', 'jar', 'bootRun', 'test'].each { taskName ->
    tasks.named(taskName) { dependsOn(validateCategoryStage) }
}
tasks.named('processResources') {
    from('src/main/migration-stages/cutover') { into 'db/migration' }
    from('src/main/migration-stages/contract') { into 'db/migration' }
    doLast {
        new File(destinationDir, 'category-transition.properties').text =
            "app.category-transition.legacy-replay-enabled=false\n"
    }
}
